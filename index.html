<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bananas</title>
    <style>
        header{
            background-color:rgb(225, 236, 139);
            text-align: center;
            max-width: 880px;
            margin: 0 auto;
            padding: 20px;
        }
        main{
            background-color: rgb(227, 234, 175);
            text-align: center;
            max-width: 880px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
        }
        img{
                width: 150px;
                height: 150px;
        }

        .artigo-autor {
                font-weight: bold;
        }

    </style>
</head>
<body>
    <header>
        <h1>Club dos fãs de Banana</h1>
     <p>Venha compartilhar o amor por Banana</p>
    </header>

    <main>
        <img src="imagem-blog.png" alt="club da banana - sem agrotoxicos">
        <div>
            <h2>Primeiro post Bananesco</h2>
            <p>Sejam bem vindos ao Club de fãs de Banana. Aqui iremos apresentar as melhores pencas de bananas saudáveis sem agrotóxicos.</p> 
            <p class="artigo-autor"> Feito por: Giovane Bragada - agricultor profissional de Bananas.</p>
            <button>🫃 <span>0</span></button>
        </div>    
    </main>
</body>

<script>
    const botao = document.querySelector("button");
    botao.addEventListener("click",botaoClicado);
    
    function botaoClicado(){
        console.log("fui clicado");
        let texto = botao.querySelector("span");
        texto.textContent++;
    }
</script>

</html>
